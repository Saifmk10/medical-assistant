services:
  postgres:
    image: postgres:18
    container_name: postgres-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the repository-root .env file or environment}
      POSTGRES_DB: ${POSTGRES_DB:-my_app}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - medical-assistant
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  medical-agent:
    build:
      context: .
      dockerfile: agents/agent-pipeline/medical_agent/Dockerfile
    ports:
      - "127.0.0.1:8080:8002"
    env_file:
      - ./agents/agent-pipeline/medical_agent/.env
    environment:
      MEDICAL_BACKEND_URL: ${MEDICAL_BACKEND_URL:-http://database-api:8001}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - medical_agent_data:/app/agents/agent-pipeline/medical_agent/.adk
    networks:
      - medical-assistant
    restart: unless-stopped

  database-api:
    build:
      context: .
      dockerfile: database/services/Dockerfile
    container_name: database-api
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the repository-root .env file or environment}@postgres:5432/${POSTGRES_DB:-my_app}}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - medical-assistant
    restart: unless-stopped

  voice-api:
    build:
      context: .
      dockerfile: voice_modules/Dockerfile
    ports:
      - "8000:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in the root .env file or environment}
      MODEL: ${MODEL:-gemini-3.1-flash-live-preview}
    networks:
      - medical-assistant
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./rev_proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - medical-agent
      - voice-api
    networks:
      - medical-assistant
    restart: unless-stopped

  uptime-kuma:
    image: louislam/uptime-kuma:2
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    ports:
      # <Host Port>:<Container Port>
      - "3001:3001"


networks:
  medical-assistant:
    name: medical-assistant
    driver: bridge

volumes:
  medical_agent_data:
  postgres_data:
  caddy_data:
    external: true
    name: pdk_caddy_data
  caddy_config:
    external: true
    name: pdk_caddy_config
